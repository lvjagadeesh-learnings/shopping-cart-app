name: CI - Backend

# Stage 1 (backend) of the pipeline: CI -> Create Release Tag -> Publish Docker Image -> Promote Docker Image
#
# Runs on every PR (merge gate, no release) and on every push to main (merge gate +
# chains into the reusable release-tag workflow to cut a new version when the
# Conventional Commits since the last tag warrant one).
#
# The workflow always triggers (so required PR status checks resolve instead of
# staying pending), but the detect-changes job skips the actual build/test/scan jobs
# when the push/PR touches no backend/** files.
#
# create-release-tag also runs from ci-frontend.yml on push to main (release tagging
# is repo-wide, not backend/frontend scoped). Both share the `release-tagging`
# concurrency group so only one actually creates the tag; the other sees the tag
# already exists (via reusable-release-tag.yml's own "no commits since last tag"
# check) and no-ops.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  detect-changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-backend.yml'

  # All 9 services build together as one clear "Build" stage instead of a
  # 9-way matrix, so the pipeline reads as a simple build -> unit test ->
  # integration test -> code scanning sequence in the Actions UI.
  build-backend:
    name: Build
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build all services (excluding Aspire AppHost)
        run: |
          # AppHost requires the Aspire CLI bundle (not available on hosted
          # runners) and isn't itself a source of deployable service logic.
          set -euo pipefail
          find . -name '*.csproj' ! -path '*/AppHost/*' -print0 | xargs -0 -n1 dotnet build --configuration Release

  unit-test-backend:
    name: Unit Tests
    needs: build-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run unit tests for all services
        run: |
          set -euo pipefail
          find . -name '*.Tests.csproj' -print0 | xargs -0 -n1 dotnet test --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/**/TestResults/**/*.trx
          if-no-files-found: ignore

  integration-test:
    name: Integration Tests
    needs: unit-test-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run integration test suites (Category=Integration)
        run: |
          set -euo pipefail
          FOUND=0
          for testcsproj in $(find . -name '*.Tests.csproj'); do
            if grep -rl 'Category.*Integration' "$(dirname "$testcsproj")" >/dev/null 2>&1; then
              FOUND=1
              echo "::group::Integration tests - ${testcsproj}"
              dotnet test "$testcsproj" --configuration Release --filter "Category=Integration" --logger "trx;LogFileName=integration-results.trx"
              echo "::endgroup::"
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No test project currently defines an Integration-category test; stage is a no-op placeholder until one is added." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # No backend e2e suite exists yet; add an `e2e-test` job here (mirroring
  # ci-frontend.yml's placeholder) once one is introduced.

  code-scanning-backend:
    name: Code Scanning (CodeQL - C#)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build (excluding Aspire AppHost)
        run: |
          # AppHost requires the Aspire CLI bundle (not available on hosted
          # runners) and isn't itself a source of application logic to scan.
          set -euo pipefail
          find backend -name '*.csproj' ! -path '*/AppHost/*' -print0 | xargs -0 -n1 dotnet build --configuration Debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  summary:
    name: Summary
    if: always()
    needs:
      [
        detect-changes,
        build-backend,
        unit-test-backend,
        integration-test,
        code-scanning-backend,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Write CI summary
        run: |
          {
            echo "### Backend CI Summary"
            echo ""
            echo "Backend changed: \`${{ needs.detect-changes.outputs.backend }}\`"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build | ${{ needs.build-backend.result }} |"
            echo "| Unit Tests | ${{ needs.unit-test-backend.result }} |"
            echo "| Integration Tests | ${{ needs.integration-test.result }} |"
            echo "| Code Scanning | ${{ needs.code-scanning-backend.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail summary if any required stage failed
        if: |
          needs.build-backend.result == 'failure' ||
          needs.unit-test-backend.result == 'failure' ||
          needs.integration-test.result == 'failure' ||
          needs.code-scanning-backend.result == 'failure'
        run: |
          echo "One or more backend CI stages failed."
          exit 1

  create-release-tag:
    name: Create Release Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [summary]
    concurrency:
      group: release-tagging
      cancel-in-progress: false
    uses: ./.github/workflows/reusable-release-tag.yml
    permissions:
      contents: write
