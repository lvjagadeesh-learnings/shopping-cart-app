name: Reusable - CloudFormation Stack Deploy

# Uses a static AWS IAM User (CLI-profile-style access key/secret) instead of OIDC
# role assumption. The access key id is passed in as a payload input (sourced by the
# caller from a GitHub Actions Variable); the secret key is picked up from the
# `AWS_SECRET_ACCESS_KEY` secret via `secrets: inherit` on the caller's job.

on:
  workflow_call:
    inputs:
      stack-name:
        required: true
        type: string
      template-path:
        description: "Path (relative to repo root) to the CFN template, e.g. infra/cloudformation/network.yaml"
        required: true
        type: string
      parameters-path:
        description: "Path (relative to repo root) to the parameters JSON file"
        required: true
        type: string
      environment:
        description: "sit | uat | prd — used for tagging only"
        required: true
        type: string
      extra-parameter-overrides:
        description: "Optional space-separated ParameterKey=Value overrides appended after the parameter file (e.g. to inject a freshly-built ContainerImage)"
        required: false
        type: string
        default: ""
      include-master-password:
        description: "If true, appends MasterUserPassword=<MASTER_USER_PASSWORD secret> to the overrides. Resolved here (not by the caller) because this job's environment: binding is what scopes the secret — a caller job cannot combine environment: with uses:."
        required: false
        type: boolean
        default: false
    outputs:
      stack-id:
        value: ${{ jobs.deploy.outputs.stack-id }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.stack-name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      stack-id: ${{ steps.deploy.outputs.stack-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (access key)
        # vars.* here resolve against this job's environment-scoped Variables
        # because the job declares `environment: ${{ inputs.environment }}` above.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Convert parameters JSON to CLI overrides
        id: params
        env:
          MASTER_USER_PASSWORD_OVERRIDE: ${{ inputs.include-master-password && format('MasterUserPassword={0}', secrets.MASTER_USER_PASSWORD) || '' }}
        run: |
          OVERRIDES=$(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' "${{ inputs.parameters-path }}" | tr '\n' ' ')
          echo "overrides=${OVERRIDES} ${{ inputs.extra-parameter-overrides }} ${MASTER_USER_PASSWORD_OVERRIDE}" >> "$GITHUB_OUTPUT"

      - name: Delete stack if stuck in ROLLBACK_COMPLETE
        # A stack in ROLLBACK_COMPLETE already had its resources rolled back and
        # cannot be updated — CloudFormation requires deleting it first.
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "${{ inputs.stack-name }}" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack is in ROLLBACK_COMPLETE — deleting before redeploying"
            aws cloudformation delete-stack --stack-name "${{ inputs.stack-name }}"
            aws cloudformation wait stack-delete-complete --stack-name "${{ inputs.stack-name }}"
          fi

      - name: Deploy stack
        id: deploy
        run: |
          aws cloudformation deploy \
            --stack-name "${{ inputs.stack-name }}" \
            --template-file "${{ inputs.template-path }}" \
            --parameter-overrides ${{ steps.params.outputs.overrides }} \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --tags Environment="${{ inputs.environment }}" ManagedBy=github-actions \
            --no-fail-on-empty-changeset

          STACK_ID=$(aws cloudformation describe-stacks --stack-name "${{ inputs.stack-name }}" --query "Stacks[0].StackId" --output text)
          echo "stack-id=${STACK_ID}" >> "$GITHUB_OUTPUT"

      - name: Show failure reason
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "--- Stack status ---"
          aws cloudformation describe-stacks --stack-name "${{ inputs.stack-name }}" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" --output table || true

          echo "--- Events matching FAILED/ROLLBACK ---"
          aws cloudformation describe-stack-events --stack-name "${{ inputs.stack-name }}" \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED') || contains(ResourceStatus, 'ROLLBACK')].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

          echo "--- Last 20 events (fallback, unfiltered) ---"
          aws cloudformation describe-stack-events --stack-name "${{ inputs.stack-name }}" \
            --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks --stack-name "${{ inputs.stack-name }}" \
            --query "Stacks[0].Outputs" --output table
