name: Reusable - .NET Service CI

on:
  workflow_call:
    inputs:
      service-name:
        description: "Folder name under backend/services, e.g. auth-service"
        required: true
        type: string
      project-path:
        description: "Path (relative to backend/) to the .Api.csproj, e.g. services/auth-service/AuthService.Api/AuthService.Api.csproj"
        required: true
        type: string
      test-project-path:
        description: "Path (relative to backend/) to the .Tests.csproj"
        required: true
        type: string
      dockerfile-path:
        description: "Path (relative to backend/) to the service's Dockerfile"
        required: true
        type: string
      image-repository:
        description: "ECR repository URI to push to. Leave empty to skip build+push."
        required: false
        type: string
        default: ""
      image-tag:
        description: "Tag to apply to the built image"
        required: false
        type: string
        default: "latest"
      aws-region:
        description: "AWS region (e.g. the caller's vars.AWS_REGION value; required if image-repository is set)"
        required: false
        type: string
        default: ""
      aws-access-key-id:
        description: "IAM user access key id (e.g. the caller's vars.AWS_ACCESS_KEY_ID value; required if image-repository is set)"
        required: false
        type: string
        default: ""
    outputs:
      image-uri:
        description: "Full image URI (repository:tag) that was pushed, if any"
        value: ${{ jobs.build-test.outputs.image-uri }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "${{ inputs.project-path }}"

      - name: Build
        run: dotnet build "${{ inputs.project-path }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ inputs.test-project-path }}" --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.service-name }}
          path: backend/**/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Configure AWS credentials (access key)
        if: inputs.image-repository != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        if: inputs.image-repository != ''
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: inputs.image-repository != ''
        run: |
          docker build -f "${{ inputs.dockerfile-path }}" -t "${{ inputs.image-repository }}:${{ inputs.image-tag }}" .
          docker push "${{ inputs.image-repository }}:${{ inputs.image-tag }}"

      - name: Set image output
        id: image
        if: inputs.image-repository != ''
        run: echo "uri=${{ inputs.image-repository }}:${{ inputs.image-tag }}" >> "$GITHUB_OUTPUT"
