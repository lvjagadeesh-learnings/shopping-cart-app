name: Reusable - Frontend CI

on:
  workflow_call:
    inputs:
      deploy:
        description: "If true, sync build output to S3 and invalidate CloudFront (requires bucket-name/distribution-id/aws-access-key-id)"
        required: false
        type: boolean
        default: false
      bucket-name:
        required: false
        type: string
        default: ""
      distribution-id:
        required: false
        type: string
        default: ""
      api-base-url:
        description: "Public ALB/API base URL baked into the frontend build via VITE_API_BASE_URL"
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub Environment to bind for AWS secrets via secrets: inherit (required if deploy is true, e.g. sit/uat/prd)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ inputs.api-base-url }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  unit-test:
    name: Unit Tests (frontend)
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -- --run

  deploy:
    name: Deploy (frontend)
    needs: unit-test
    if: inputs.deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials (access key)
        # vars.* here resolve against this job's environment-scoped Variables
        # because the job declares `environment: ${{ inputs.environment }}` above.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist "s3://${{ inputs.bucket-name }}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ inputs.distribution-id }}" --paths "/*"
