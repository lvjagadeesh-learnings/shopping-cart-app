name: Security Scan

# Repo-wide security gate: dependency/filesystem vulnerability scan, IaC (CloudFormation)
# config scan, and secret-leak scan. Runs on every PR and every push to main,
# independent of the backend/frontend change-detection in ci-backend.yml /
# ci-frontend.yml, since these checks are cheap and cover the whole repo (including
# infra/ and root-level files that neither backend/** nor frontend/** would match).

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vulnerability-scan:
    name: Vulnerability Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy IaC config scan (CloudFormation)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/cloudformation
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Secret leak scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  summary:
    name: Summary
    if: always()
    needs: [vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Write CI summary
        run: |
          {
            echo "### Security Scan Summary"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Vulnerability Checks | ${{ needs.vulnerability-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail summary if any required stage failed
        if: needs.vulnerability-scan.result == 'failure'
        run: |
          echo "Security scan failed."
          exit 1
