AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Shopping Cart App - Internet-facing Application Load Balancer with an
  HTTP listener (port 80) and, when a certificate is supplied, an HTTPS
  listener (port 443) that HTTP redirects to. Both listeners default to a
  fixed 404 response; each microservice adds its own path-based
  ListenerRule + TargetGroup from ecs-service.yaml.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [sit, uat, prd]

  CertificateArn:
    Type: String
    Default: ''
    Description: >
      Optional ACM certificate ARN. When empty, only the HTTP listener is
      created (suitable for sit). When set, HTTPS is enabled and HTTP
      redirects to HTTPS.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-shopping-cart-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - Fn::ImportValue: !Sub ${EnvironmentName}-AlbSecurityGroupId
      Subnets:
        - Fn::ImportValue: !Sub ${EnvironmentName}-PublicSubnet1Id
        - Fn::ImportValue: !Sub ${EnvironmentName}-PublicSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-shopping-cart-alb

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: '404'
              ContentType: text/plain
              MessageBody: Not Found

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: Not Found

Outputs:
  LoadBalancerArn:
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub ${EnvironmentName}-AlbArn

  LoadBalancerDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub ${EnvironmentName}-AlbDnsName

  HttpListenerArn:
    Value: !Ref HttpListener
    Export:
      Name: !Sub ${EnvironmentName}-AlbHttpListenerArn

  HttpsListenerArn:
    Condition: HasCertificate
    Value: !Ref HttpsListener
    Export:
      Name: !Sub ${EnvironmentName}-AlbHttpsListenerArn
