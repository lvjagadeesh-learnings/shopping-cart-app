AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Shopping Cart App - PostgreSQL data layer (schema-per-service isolation).
  Runs as a single-instance ECS Fargate task (image: postgres:16-alpine) with
  its data directory on an EFS file system, fronted by an internal Network
  Load Balancer so the endpoint is stable across task restarts/redeploys.
  This replaces Aurora/RDS: the sandbox account's SCP denies
  rds:CreateDBInstance unconditionally for every engine/instance class, with
  no CloudFormation-level workaround (confirmed via
  `aws rds describe-db-engine-versions`). Every resource here uses only
  EC2/ECS/EFS/ELBv2 actions, none of which are denied. Depends on
  network.yaml exports (VPC/private subnets/database security group),
  ecs-cluster.yaml (cluster) and iam.yaml (task execution role).

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [sit, uat, prd]

  DatabaseName:
    Type: String
    Default: shoppingcart

  MasterUsername:
    Type: String
    Default: shoppingcart_admin

  MasterUserPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: PostgreSQL master password (supplied via secret, not generated - sandbox SCP denies secretsmanager:GetRandomPassword).

  PostgresImage:
    Type: String
    Default: postgres:16-alpine

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${EnvironmentName}/shopping-cart/db-credentials
      Description: !Sub PostgreSQL master credentials for ${EnvironmentName}
      SecretString: !Sub '{"username":"${MasterUsername}","password":"${MasterUserPassword}"}'

  PostgresLogGroup:
    Type: AWS::Logs::LogGroup
    # Retain on delete/rollback: the sandbox IAM user lacks logs:DeleteLogGroup,
    # so CloudFormation-driven deletes of this resource always fail and leave
    # the stack stuck in ROLLBACK_FAILED/DELETE_FAILED. Retaining avoids that;
    # the log group is cheap to leave orphaned if the stack is ever deleted.
    # Explicit name keyed on AWS::StackId's GUID (not just the stack name):
    # CFN's auto-generated name for this resource type is NOT guaranteed
    # unique across delete+recreate cycles of the same stack name, so a
    # retained orphan from a prior attempt could collide with the new one
    # (and CFN's collision-recovery also needs logs:DeleteLogGroup, which
    # fails the same way). The StackId GUID changes on every fresh create.
    # No RetentionInDays: the sandbox IAM user also lacks logs:PutRetentionPolicy;
    # setting it makes CFN's create handler fail after CreateLogGroup succeeds,
    # then attempt a self-cleanup DeleteLogGroup (also denied), surfacing a
    # misleading DeleteLogGroup error instead of the real PutRetentionPolicy one.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - ${EnvironmentName}-database-postgres-${UniqueId}
        - UniqueId: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  PostgresFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-shopping-cart-postgres-data

  PostgresEfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${EnvironmentName} EFS security group - allows inbound NFS only from the postgres task
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub ${EnvironmentName}-DatabaseSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-postgres-efs-sg

  PostgresMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref PostgresFileSystem
      SubnetId:
        Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet1Id
      SecurityGroups:
        - !Ref PostgresEfsSecurityGroup

  PostgresMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref PostgresFileSystem
      SubnetId:
        Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet2Id
      SecurityGroups:
        - !Ref PostgresEfsSecurityGroup

  PostgresAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref PostgresFileSystem
      PosixUser:
        Uid: '999'
        Gid: '999'
      RootDirectory:
        Path: /postgres-data
        CreationInfo:
          OwnerUid: '999'
          OwnerGid: '999'
          Permissions: '0755'

  PostgresTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-postgres
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn:
        Fn::ImportValue: !Sub ${EnvironmentName}-EcsTaskExecutionRoleArn
      Volumes:
        - Name: postgres-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref PostgresFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref PostgresAccessPoint
      ContainerDefinitions:
        - Name: postgres
          Image: !Ref PostgresImage
          Essential: true
          PortMappings:
            - ContainerPort: 5432
              Protocol: tcp
          MountPoints:
            - SourceVolume: postgres-data
              ContainerPath: /var/lib/postgresql/data
              ReadOnly: false
          Environment:
            - Name: POSTGRES_DB
              Value: !Ref DatabaseName
            - Name: POSTGRES_USER
              Value: !Ref MasterUsername
            - Name: POSTGRES_PASSWORD
              Value: !Ref MasterUserPassword
            - Name: PGDATA
              Value: /var/lib/postgresql/data/pgdata
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PostgresLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: postgres

  PostgresTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-postgres-tg
      Port: 5432
      Protocol: TCP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      HealthCheckProtocol: TCP

  PostgresLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-postgres-nlb
      Type: network
      Scheme: internal
      Subnets:
        - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet1Id
        - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-postgres-nlb

  PostgresListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PostgresLoadBalancer
      Port: 5432
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PostgresTargetGroup

  PostgresService:
    Type: AWS::ECS::Service
    DependsOn:
      - PostgresListener
      - PostgresMountTarget1
      - PostgresMountTarget2
    Properties:
      ServiceName: !Sub ${EnvironmentName}-postgres
      Cluster:
        Fn::ImportValue: !Sub ${EnvironmentName}-EcsClusterArn
      TaskDefinition: !Ref PostgresTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet1Id
            - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet2Id
          SecurityGroups:
            - Fn::ImportValue: !Sub ${EnvironmentName}-DatabaseSecurityGroupId
      LoadBalancers:
        - ContainerName: postgres
          ContainerPort: 5432
          TargetGroupArn: !Ref PostgresTargetGroup
      DeploymentConfiguration:
        # A single EFS-backed postgres data dir can't tolerate two concurrent
        # writers, so force stop-old-then-start-new instead of ECS's default
        # rolling (start-new-before-stop-old) deployment.
        MaximumPercent: 100
        MinimumHealthyPercent: 0

Outputs:
  ClusterEndpoint:
    Value: !GetAtt PostgresLoadBalancer.DNSName
    Export:
      Name: !Sub ${EnvironmentName}-DbClusterEndpoint

  ClusterPort:
    Value: '5432'
    Export:
      Name: !Sub ${EnvironmentName}-DbClusterPort

  DatabaseName:
    Value: !Ref DatabaseName
    Export:
      Name: !Sub ${EnvironmentName}-DbName

  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub ${EnvironmentName}-DbSecretArn
