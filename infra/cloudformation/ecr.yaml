    Value: !GetAtt AuthServiceRepository.RepositoryUri
    Export:
      Name: !Sub ${EnvironmentName}-AuthServiceRepositoryUri

  CatalogServiceRepositoryUri:
    Value: !GetAtt CatalogServiceRepository.RepositoryUri
    Export:
