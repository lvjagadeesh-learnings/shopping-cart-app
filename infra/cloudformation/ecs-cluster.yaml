AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Shopping Cart App - ECS Cluster with Fargate + Fargate Spot capacity
  providers and Container Insights enabled.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [sit, uat, prd]

Resources:
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-shopping-cart-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 1
        - CapacityProvider: FARGATE_SPOT
          Weight: 4

  # NOTE: the AWS::ServiceDiscovery::PrivateDnsNamespace resource that used to
  # live here was removed - the sandbox account's SCP denies
  # servicediscovery:TagResource, which CloudFormation invokes automatically
  # via stack-level --tags propagation. The namespace was unused (no other
  # template imported ServiceDiscoveryNamespaceId), so it was deleted rather
  # than worked around.

Outputs:
  ClusterName:
    Value: !Ref EcsCluster
    Export:
      Name: !Sub ${EnvironmentName}-EcsClusterName

  ClusterArn:
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub ${EnvironmentName}-EcsClusterArn
