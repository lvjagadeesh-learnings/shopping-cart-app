AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Shopping Cart App - Static frontend hosting via S3 static website hosting
  (public-read bucket, static assets only, no secrets). No CDN in front:
  the sandbox account's SCP has an explicit deny on cloudfront:CreateDistribution
  (as well as cloudfront:CreateOriginAccessControl and
  cloudfront:CreateCloudFrontOriginAccessIdentity), so NO CloudFront distribution
  can be created here under any origin-access configuration. S3 website hosting's
  ErrorDocument is set to index.html so SPA client-side routing still works for
  deep links/refreshes (served with a 404 status rather than CloudFront's 200
  rewrite, which is the one behavioral trade-off of dropping CloudFront).

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [sit, uat, prd]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-shopping-cart-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadStaticAssets
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

Outputs:
  BucketName:
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${EnvironmentName}-FrontendBucketName

  WebsiteURL:
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub ${EnvironmentName}-FrontendWebsiteURL

